<!doctype html>
<meta charset="utf-8">
<!-- What's new 1.0.0, margin notes (flywheel docs/standards/whats-new.md): CSS only, nothing fetched.
     4 s loop: under Seneca's contribution, a tap on Push back puts a red mark in the margin. -->
<style>
  :root{--bg:#100e0b;--line:#26211a;--ring:#776f61;--ink:#ece7db;--hi:#f8f5ee;--dim:#968d7c;--clay:#cf9179;--clay5:#a8674f;--dot:#efce8d}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.3 Inter,system-ui,sans-serif;overflow:hidden}
  .f{position:relative;height:100%;padding:16px;box-sizing:border-box}
  .who{display:flex;align-items:center;gap:10px}
  .mono{width:30px;height:30px;border-radius:50%;border:1px solid var(--ring);display:grid;place-items:center;font:500 12px Georgia,serif;color:var(--ink)}
  .who b{font:500 16px Georgia,'EB Garamond',serif;color:var(--hi)}
  .bar{height:9px;border-radius:2px;background:var(--line);margin:10px 0 0}
  .row{display:flex;gap:22px;margin-top:12px;font-weight:600;color:var(--dim);font-size:14px;height:22px;align-items:center}
  .row span:nth-child(2){animation:press 4s infinite}
  .row{animation:row 4s infinite}
  .note{border-left:2px solid var(--clay5);padding-left:10px;margin-top:-22px;opacity:0;animation:note 4s infinite}
  .rub{font:600 15px Georgia,serif;font-variant-caps:all-small-caps;letter-spacing:.06em;color:var(--clay)}
  .txt{font:italic 14px Georgia,serif;color:var(--ink);margin-top:2px;white-space:nowrap;overflow:hidden;width:0;animation:type 4s steps(32) infinite}
  .dot{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--dot);opacity:0;left:113px;top:107px;animation:tap 4s infinite}
  @keyframes tap{0%,14%{opacity:0;transform:scale(.5)}20%{opacity:.45;transform:scale(1)}28%,100%{opacity:0}}
  @keyframes press{0%,18%,26%,100%{color:var(--dim)}20%{color:var(--hi)}}
  @keyframes row{0%,26%{opacity:1}30%,96%{opacity:0}100%{opacity:1}}
  @keyframes note{0%,28%{opacity:0}32%,94%{opacity:1}100%{opacity:0}}
  @keyframes type{0%,36%{width:0}70%,94%{width:100%}100%{width:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.row{opacity:0}.note{opacity:1}.txt{width:100%}}
</style>
<div class="f" aria-hidden="true">
  <div class="who"><div class="mono">Se</div><b>Seneca</b></div>
  <div class="bar" style="width:92%"></div><div class="bar" style="width:64%"></div>
  <div class="row"><span>Agree</span><span>Push back</span><span>Note</span></div>
  <div class="note"><div class="rub">You push back</div><div class="txt">The deadline is not mine to move</div></div>
</div>

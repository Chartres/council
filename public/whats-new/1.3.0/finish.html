<!doctype html>
<meta charset="utf-8">
<!-- What's new 1.3.0, no waiting for silence (flywheel docs/standards/whats-new.md): CSS only,
     nothing fetched. 6 s loop: the line moves, rests for a long pause while the Finish button stays as it is, moves again. -->
<style>
  html,body{margin:0;height:100%;background:#100e0b;overflow:hidden}
  body{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 20px;box-sizing:border-box;font:400 19px/27px "EB Garamond","Iowan Old Style",Georgia,serif;color:#d8d1c2}
  svg{width:100%;height:28px;flex:none}
  path{fill:none;stroke:#e0b263;stroke-width:1.5;stroke-linecap:round;transform-origin:50% 50%;animation:v 6s ease-in-out infinite}
  .say{position:relative;height:27px}
  .say span{position:absolute;inset:0;animation:a 6s linear infinite}
  .say span+span{animation-name:b}
  .btn{height:40px;flex:none;border-radius:4px;background:#e0b263;color:#100e0b;font-weight:600;display:flex;align-items:center;justify-content:center}
  @keyframes v{0%,100%{transform:scaleY(.9)}8%{transform:scaleY(.4)}16%{transform:scaleY(1)}26%,74%{transform:scaleY(.02)}84%{transform:scaleY(.7)}92%{transform:scaleY(.3)}}
  @keyframes a{0%,30%{opacity:1}36%,72%{opacity:0}78%,100%{opacity:1}}
  @keyframes b{0%,30%{opacity:0}36%,72%{opacity:1}78%,100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}path{transform:scaleY(.02)}.say span{opacity:0}.say span+span{opacity:1}}
</style>
<svg viewBox="0 0 320 36" preserveAspectRatio="none"><path d="M0 18c14 0 16-9 27-9s14 18 27 18 14-24 27-24 14 28 27 28 14-20 27-20 14 14 27 14 14-22 27-22 14 26 27 26 14-16 27-16 14 5 27 5 16 0 23 0"/></svg>
<div class="say"><span>Recording. I can hear you.</span><span>Recording. Take your time.</span></div>
<div class="btn">Finish</div>

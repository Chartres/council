<!doctype html>
<meta charset="utf-8">
<!-- What's new 1.3.0, the words are yours to correct (flywheel docs/standards/whats-new.md): CSS
     only, nothing fetched. 6 s loop: the sentence arrives, one word is struck and replaced, Send lights. -->
<style>
  html,body{margin:0;height:100%;background:#100e0b;overflow:hidden}
  body{display:flex;flex-direction:column;justify-content:center;gap:8px;padding:0 20px;box-sizing:border-box;font:400 19px/27px "EB Garamond","Iowan Old Style",Georgia,serif;color:#ece7db}
  .field{background:#1e1a15;border-radius:4px;padding:8px 14px;white-space:nowrap;box-shadow:inset 0 -2px 0 #e0b263}
  .old,.new{display:inline-block;overflow:hidden;white-space:nowrap;vertical-align:bottom}
  .old{animation:o 6s steps(1) infinite;color:#cf9179}
  .new{max-width:0;animation:n 6s ease-out infinite}
  .btn{height:40px;flex:none;border-radius:4px;border:1px solid #5e5446;color:#b9b1a0;font-weight:600;display:flex;align-items:center;justify-content:center;animation:s 6s steps(1) infinite}
  @keyframes o{0%,100%{max-width:4em;text-decoration:none}30%{max-width:4em;text-decoration:line-through}45%,95%{max-width:0}}
  @keyframes n{0%,45%{max-width:0}60%,95%{max-width:4em}100%{max-width:0}}
  @keyframes s{0%,100%{background:transparent;color:#b9b1a0;border-color:#5e5446}62%,95%{background:#e0b263;color:#100e0b;border-color:#e0b263}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.old{max-width:0}.new{max-width:4em}.btn{background:#e0b263;color:#100e0b;border-color:#e0b263}}
</style>
<div class="field">We have <span class="old">two</span><span class="new">three</span> engineers.</div>
<div class="btn">Send</div>

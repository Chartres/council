<!doctype html>
<meta charset="utf-8">
<!-- What's new 1.4.0, the sentence being read (flywheel docs/standards/whats-new.md): CSS only,
     nothing fetched. 6 s loop: the mark moves through three sentences, the dots light in turn. -->
<style>
  html,body{margin:0;height:100%;background:#100e0b;overflow:hidden}
  body{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 20px;box-sizing:border-box;font:400 18px/25px "EB Garamond","Iowan Old Style",Georgia,serif;color:#968d7c}
  .who{font-variant-caps:all-small-caps;letter-spacing:.08em;color:#f8f5ee;display:flex;align-items:center;gap:8px}
  .d{display:inline-block;width:6px;height:6px;border-radius:50%;background:#342d23}
  .s{animation:6s steps(1) infinite}
  .s1,.d1{animation-name:a1}.s2,.d2{animation-name:a2}.s3,.d3{animation-name:a3}
  .d{animation-duration:6s;animation-timing-function:steps(1);animation-iteration-count:infinite}
  @keyframes a1{0%{color:#f8f5ee;background:linear-gradient(transparent 62%,rgba(224,178,99,.3) 62%)}33%,100%{color:#b9b1a0;background:none}}
  @keyframes a2{0%{color:#968d7c;background:none}33%{color:#f8f5ee;background:linear-gradient(transparent 62%,rgba(224,178,99,.3) 62%)}66%,100%{color:#b9b1a0;background:none}}
  @keyframes a3{0%{color:#968d7c;background:none}66%{color:#f8f5ee;background:linear-gradient(transparent 62%,rgba(224,178,99,.3) 62%)}100%{color:#b9b1a0}}
  .d1{animation-name:b1}.d2{animation-name:b2}.d3{animation-name:b3}
  @keyframes b1{0%{background:#e0b263}33%,100%{background:#776f61}}
  @keyframes b2{0%{background:#342d23}33%{background:#e0b263}66%,100%{background:#776f61}}
  @keyframes b3{0%{background:#342d23}66%{background:#e0b263}100%{background:#776f61}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.s1{color:#f8f5ee}.d1{background:#e0b263}}
</style>
<div class="who">Franklin <span class="d d1"></span><span class="d d2"></span><span class="d d3"></span></div>
<div><span class="s s1">Write both numbers down.</span> <span class="s s2">Sleep on it.</span> <span class="s s3">Then decide.</span></div>
